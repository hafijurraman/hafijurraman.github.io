      - name: Vision Transformer (ViT)-Based ASL Recognition
        date: 2025-04
        url: https://github.com/hafijurraman/asl-vit
        summary: An American Sign Language classifier built by fine-tuning Hugging Face's pretrained Vision Transformer (ViT), using data augmentation and class weighting.
        highlights:
          - Achieved an overall accuracy of 94% on a diverse dataset of over 26,000 images.

