    Projects:
      - name: AI Fast Food Ordering Agent
        date: 2025-12
        url: https://github.com/Da-Emp66/FastFoodOrderingAgent
        summary: A system that takes voice or text commands, such as "Order me a cheeseburger," and automatically finds the nearest restaurant to start the order.
